# HalloweenGear config

resource-pack:
  # Weapons use the custom models/textures from the resource pack
  # (assets/halloweengear/...). Set to false for plain netherite-looking weapons
  # with no pack required.
  enabled: true

armor:
  # Armor is dyed leather by default. Set true to also use the resource pack's custom icons,
  # 3D hats/hood and worn-armor models for the armor (needs the pack, give new items after).
  use-resource-pack: false
  # Per-piece stats (netherite values by default). Applies to newly created items.
  stats:
    armor: [3, 8, 6, 3]        # helmet, chestplate, leggings, boots
    toughness: 3.0             # per piece
    knockback-resistance: 0.1  # per piece (0.4 total = netherite)
  # Potion effects + particles while wearing all 4 pieces of a set.
  set-bonuses: true
  particles: true
  # Wraith set: chance (0.0 - 1.0) to completely dodge an incoming hit.
  wraith-dodge-chance: 0.15
  # Witch set: heal this many HP every 3 seconds.
  witch-heal-amount: 1.0

items:
  # Dropped Halloween items can't burn up in fire/lava or blow up.
  fireproof: true
  # Dropped Halloween items never despawn.
  never-despawn: true

weapons:
  cursed-blade:
    # Passive: every hit.
    wither-seconds: 4
    weakness-seconds: 5
    # Chance per hit to spread Wither to up to 3 nearby enemies.
    curse-spread-chance: 0.15
    # Right-click: Cursed Nova (burst around you, costs health).
    nova-cooldown-seconds: 10
    nova-radius: 6.0
    nova-damage: 6.0
    nova-hp-cost: 2.0

  reaper-scythe:
    # Passive: chance on hit to steal life.
    lifesteal-chance: 0.25
    lifesteal-amount: 2.0
    # Kills store souls; Soul Slash spends them all.
    max-souls: 5
    soul-bonus-damage: 2.0
    # Right-click: Soul Slash.
    slash-cooldown-seconds: 8
    slash-damage: 8.0
    slash-radius: 4.5
    heal-per-target: 1.0
    max-heal: 6.0

  bat-bow:
    # Shots drawn less than this (0.0 - 1.0) don't make bats.
    min-force: 0.5
    # Shots drawn at least this far are empowered (double bats, bigger radius, blind).
    empowered-force: 0.95
    bat-count: 6
    # Damage dealt once per second to everything near the impact point.
    pulse-damage: 3.0
    radius: 3.5
    duration-seconds: 3
    affect-players: true
    # HP the shooter regains each second the swarm is hitting something.
    bat-heal: 1.0
    empowered-blind-seconds: 3
