# HalloweenGear 2.0.0 - Complete rebuild for Paper 1.21.11
# Item stats / lore are baked when an item is created. Re-give gear after changing values.

armor:
  set-bonuses: true
  particles: true

  # Wraith set: chance (0.0-1.0) to completely dodge an incoming hit
  wraith-dodge-chance: 0.20
  # Witch set: heal this many HP every 3 seconds while full set worn
  witch-heal-amount: 1.5

  # Base per-piece stats = vanilla Netherite
  stats:
    armor: [3, 8, 6, 3]        # helmet, chestplate, leggings, boots
    toughness: 3.0
    knockback-resistance: 0.1

  # Extra attribute each piece gives
  bonus:
    pumpkin-king-max-health: 2.0   # per piece (+8 HP = +4 hearts full set)
    wraith-move-speed: 0.04        # per piece (+16% full set)
    witch-absorption: 1.0          # per piece (+4 absorption full set)

  # Full-set active abilities. Trigger: Sneak + Swap Hands (default F)
  abilities:
    enabled: true
    pumpkin_king:                  # Hellfire Nova
      cooldown-seconds: 25
      radius: 6.0
      damage: 8.0
      fire-seconds: 6
      thorns-fire-seconds: 4
    wraith:                        # Shadow Step
      cooldown-seconds: 12
      distance: 9.0
      invisibility-seconds: 3
    witch:                         # Hex Burst
      cooldown-seconds: 20
      radius: 7.0
      curse-seconds: 6
      self-regen-seconds: 6
      self-absorption-seconds: 10

items:
  fireproof: true
  never-despawn: true

weapons:
  cursed-blade:
    attack-damage: 12.0
    attack-speed: 1.7
    wither-seconds: 4
    weakness-seconds: 5

  reaper-scythe:
    lifesteal-chance: 0.25
    lifesteal-amount: 2.0
    slash-cooldown-seconds: 8
    slash-damage: 8.0
    slash-radius: 4.5
    heal-per-target: 1.0
    max-heal: 6.0

  bat-bow:
    bat-count: 6
    pulse-damage: 3.0
    radius: 3.5
    duration-seconds: 3
    affect-players: true
