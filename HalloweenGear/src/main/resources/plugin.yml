name: HalloweenGear
version: '2.0.0'
main: dev.halloweengear.HalloweenGear
api-version: '1.21'
author: HalloweenGear Rebuild
description: Custom Halloween armor sets (Pumpkin King, Wraith, Witch) and weapons for Paper 1.21.11
commands:
  halloween:
    description: Give or list Halloween gear
    usage: /halloween <give|giveset|list|reload>
    aliases: [hgear, hw]
permissions:
  halloweengear.give:
    description: Allows /halloween give and /halloween giveset
    default: op
  halloweengear.admin:
    description: Allows /halloween reload
    default: op
