name: HalloweenGear
version: '${project.version}'
main: dev.halloweengear.HalloweenGear
api-version: '1.21'
description: Halloween armor sets and weapons.
commands:
  halloween:
    description: Give or list Halloween gear
    usage: /halloween <give|giveset|list|reload>
    aliases: [hgear, hw]
permissions:
  halloweengear.give:
    description: Allows /halloween give and /halloween giveset
    default: op
  halloweengear.admin:
    description: Allows /halloween reload
    default: op
