name: Build HalloweenGear
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate project
        id: loc
        run: |
          f=$(find . -path '*/src/main/java/dev/halloweengear/GearListener.java' | head -1)
          echo "Found: $f"
          test -n "$f" || { echo "GearListener.java not found - source not uploaded"; exit 1; }
          echo "dir=${f%/src/main/java/dev/halloweengear/GearListener.java}" >> "$GITHUB_OUTPUT"
      - run: mvn -B -ntp -f "${{ steps.loc.outputs.dir }}/pom.xml" clean package
      - uses: actions/upload-artifact@v4
        with:
          name: HalloweenGear
          path: ${{ steps.loc.outputs.dir }}/target/HalloweenGear.jar
